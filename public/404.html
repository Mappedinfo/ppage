<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面跳转中...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 500px;
    }

    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 2rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1rem;
      opacity: 0.95;
    }

    p {
      font-size: 1rem;
      opacity: 0.85;
      line-height: 1.6;
    }

    .path {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.875rem;
      word-break: break-all;
      backdrop-filter: blur(10px);
    }
  </style>
  <script>
    // GitHub Pages 对未知路径返回本页（HTTP 404）。
    // 页面路由：把完整路径存入 sessionStorage 后跳回站点根目录；
    // 应用启动时（src/main.jsx）读取并恢复地址，由 React Router 渲染原页面。
    // 静态文件（.md/.pdf/图片等）：不跳转，直接提示文件不存在。
    (function () {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var fullPath = path + search + hash;

      if (/\.(md|pdf|jpg|jpeg|png|gif|svg|css|js|ico|json|xml|txt|ya?ml)$/i.test(path)) {
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelector('.loader').style.display = 'none';
          document.querySelector('h1').textContent = '文件不存在';
          document.querySelector('p').textContent = '请求的文件不存在，请检查链接。';
          document.getElementById('redirect-path').textContent = fullPath;
        });
        return;
      }

      try {
        sessionStorage.setItem('redirectPath', fullPath);
      } catch (e) {
        // 无法写入存储（部分隐私模式）时仍回到首页，只是不会恢复原路径
      }
      window.location.replace('/');
    })();
  </script>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>🚀 页面跳转中...</h1>
    <p>正在将您重定向到正确的页面</p>
    <div class="path">
      <div id="redirect-path"></div>
    </div>
  </div>
</body>
</html>
